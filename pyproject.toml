[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finbot-earnings"
version = "0.1.0"
description = "Low-latency ingestion and structured extraction of official earnings artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=12,<13",
  "openai>=2.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "build>=1.2,<2",
  "boto3==1.43.114",
  "moto[dynamodb]==5.2.4",
  "aws-cdk-lib==2.273.0",
  "constructs==10.8.1",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
]
aws = ["boto3==1.43.114"]

[project.scripts]
earnings = "finbot_earnings.cli:main"
earnings-eval = "finbot_earnings.evaluation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finbot_earnings = ["companies.toml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: opt-in tests which may use live network services",
]
