[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finbot-earnings"
version = "0.1.0"
description = "Low-latency ingestion and structured extraction of official earnings artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
earnings = "finbot_earnings.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finbot_earnings = ["companies.toml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: opt-in tests which may use live network services",
]
